            currentView: 'home', // 'home', 'shop', 'admin'
            cart: [],
            isCartOpen: false,

        const formatPrice = (price) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(price);
        
        const getMinDeliveryDate = () => {
            const date = new Date();
            date.setDate(date.getDate() + 2);
            return date.toISOString().split('T')[0];
        };

        const getCartTotal = () => state.cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);

        // --- COMPONENTES UI (Generadores de HTML) ---

                ${text}
            </button>
        `;

            <span class="inline-block ${color} text-white font-black uppercase text-sm px-3 py-1 rounded-full shadow-md ${className}">
                ${text}
            </span>
        `;

            <div class="flex items-center space-x-2 ${color} rounded-full px-4 py-2 border-2 border-transparent hover:border-[#3C2317] cursor-pointer transition-colors">

                <span class="bg-[#3C2317] text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center">${count}</span>
            </div>
        `;

        const ProductCard = (product) => `
            <div class="bg-white rounded-[2rem] p-4 flex flex-col items-center text-center shadow-sm border-2 border-[#3C2317]/5 hover:border-[#3C2317]/20 transition-all hover:-translate-y-2">

                    <img src="${product.image}" alt="${product.name[state.lang]}" class="w-full h-full object-cover" />

                <h3 class="font-black text-[#3C2317] uppercase text-lg leading-tight mb-1">${product.name[state.lang]}</h3>
                <p class="text-xs text-[#3C2317]/60 mb-3 font-medium px-2">${product.description[state.lang]}</p>
                <div class="mt-auto w-full flex justify-between items-center">
                    <span class="font-black text-[#FF9B71] text-xl">${formatPrice(product.price)}</span>
                    <button onclick="window.addToCart(${product.id})" class="bg-[#3C2317] text-white p-2 rounded-full hover:bg-[#8B5CF6] transition-colors">
                        <i class="ph ph-plus text-xl"></i>
                    </button>
                </div>
            </div>
        `;

        // --- FUNCIONES DE ACCIÓN ---
        window.changeView = (view) => {
            state.currentView = view;
            state.isMobileMenuOpen = false;
            renderApp();
        };

        window.toggleCart = (isOpen) => {
            state.isCartOpen = isOpen;
            renderCart();
        };

        window.toggleMobileMenu = () => {
            state.isMobileMenuOpen = !state.isMobileMenuOpen;
            renderNavbar();
        };

        window.toggleLang = () => {
            state.lang = state.lang === 'es' ? 'en' : 'es';
            document.documentElement.lang = state.lang; // Cambiar atributo de accesibilidad
            renderApp(); // Re-renderizar todo con el nuevo idioma
        };

        window.addToCart = (productId) => {
            const product = products.find(p => p.id === productId);
            const existing = state.cart.find(item => item.product.id === productId);
            if (existing) {
                existing.qty += product.minOrder;
            } else {
                state.cart.push({ product, qty: product.minOrder });
            }
            window.toggleCart(true);
            renderNavbar(); 
        };

        window.removeFromCart = (productId) => {
            state.cart = state.cart.filter(item => item.product.id !== productId);
            renderCart();
            renderNavbar(); 
        };

        // --- FUNCIONES DE RENDERIZADO ---

            if (state.currentView === 'admin') {
                document.getElementById('navbar-root').innerHTML = '';
                return;
            }

                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 max-w-3xl">
                            ${products.map(p => ProductCard(p)).join('')}
                        </div>
                    </div>

                    <!-- Bento Box Section -->
                    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-16">
                        <div class="bg-[#3C2317] rounded-[3rem] p-8 md:p-12 flex flex-col md:flex-row items-center gap-12 relative overflow-hidden">
                            <div class="absolute top-8 left-8 flex flex-col gap-2 opacity-50">
                                <div class="w-2 h-2 bg-[#FF9B71] rounded-full"></div>

                        </div>
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-stone-200">
                            <h2 class="font-bold text-[#3C2317] uppercase mb-4">${t('adminSubtitle')}</h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${['Pending', 'Baking', 'Ready'].map(statusKey => `
                                    <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100">
                                        <h3 class="font-black text-stone-400 uppercase text-sm mb-3">${t('adminStatus')[statusKey]}</h3>
                                        ${getOrdersHTML(statusKey)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('main-root').innerHTML = html;
        };

        const renderFooter = () => {
            if (state.currentView === 'admin') {
                document.getElementById('footer-root').innerHTML = '';
                return;
            }
            document.getElementById('footer-root').innerHTML = `
                <footer class="bg-white py-12 px-4 border-t-2 border-[#3C2317]/10 mt-12">
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                        <h3 class="font-black text-3xl text-[#3C2317] tracking-tighter uppercase">Rollin.</h3>
                        <div class="flex flex-wrap justify-center gap-4 text-sm font-bold uppercase text-[#3C2317]/60">
                            <button class="hover:text-[#3C2317]">${t('footerWholesale')}</button>
                            <button class="hover:text-[#3C2317]">${t('footerContact')}</button>
                            <button onclick="window.changeView('admin')" class="hover:text-[#8B5CF6]">${t('footerAdmin')}</button>
                        </div>
                    </div>
                </footer>
            `;
        };

        const renderCart = () => {
            const overlayClass = state.isCartOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none';
            const panelClass = state.isCartOpen ? 'translate-x-0' : 'translate-x-full';
            
            let cartItemsHTML = '';
            if (state.cart.length === 0) {
                cartItemsHTML = `
                    <div class="text-center text-[#3C2317]/30 mt-20 flex flex-col items-center">
                        <i class="ph ph-shopping-bag text-6xl mb-4"></i>
                        <p class="font-bold uppercase">${t('cartEmpty')}</p>
                    </div>
                `;
            } else {
                cartItemsHTML = state.cart.map(item => `
                    <div class="flex gap-4 bg-white p-3 rounded-2xl border-2 border-[#3C2317]/10 items-center">
                        <img src="${item.product.image}" alt="${item.product.name[state.lang]}" class="w-16 h-16 object-cover rounded-xl" />
                        <div class="flex-grow">
                            <h4 class="font-black text-[#3C2317] text-sm uppercase leading-tight">${item.product.name[state.lang]}</h4>
                            <p class="text-xs font-bold text-[#3C2317]/50 mb-1">${t('cartQty')}: ${item.qty} ${t('cartUnits')}</p>
                            <div class="flex justify-between items-center">
                                <span class="font-black text-[#FF9B71]">${formatPrice(item.product.price * item.qty)}</span>
                                <button onclick="window.removeFromCart(${item.product.id})" class="text-red-400 hover:text-red-600 p-1"><i class="ph ph-trash text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');

                cartItemsHTML += `
                    <div class="bg-white p-4 rounded-2xl border-2 border-[#3C2317]/10 mt-6 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-2 h-full bg-[#9BE1E8]"></div>
                        <label class="block text-sm font-black text-[#3C2317] uppercase mb-1 flex items-center ml-2">
                            <i class="ph ph-calendar mr-2 text-lg"></i> ${t('cartDateLabel')}
                        </label>
                        <p class="text-[10px] font-bold text-[#3C2317]/50 uppercase mb-3 ml-2">${t('cartDateSub')}</p>
                        <input type="date" min="${getMinDeliveryDate()}" class="w-full ml-2 p-2 border-2 border-[#3C2317]/20 rounded-xl focus:outline-none focus:border-[#8B5CF6] font-bold text-[#3C2317] text-sm" required />
                    </div>
                `;
            }

            const cartFooterHTML = state.cart.length > 0 ? `
                <div class="p-6 bg-white border-t-2 border-[#3C2317]/10">
                    <div class="flex justify-between items-end mb-4">
                        <span class="font-bold text-[#3C2317]/60 uppercase text-sm">${t('cartTotal')}</span>
                        <span class="text-3xl font-black text-[#3C2317] leading-none">${formatPrice(getCartTotal())}</span>
                    </div>
                    <button class="w-full bg-[#3C2317] text-white p-4 rounded-full font-black uppercase tracking-wider hover:bg-[#FF9B71] transition-colors flex justify-center items-center shadow-[4px_4px_0px_0px_#FFDC39]">
                        ${t('btnCheckout')} <i class="ph ph-arrow-right ml-2 text-xl"></i>
                    </button>
                    <div class="flex justify-center gap-2 mt-4 opacity-40 grayscale">
                        <i class="ph ph-credit-card text-2xl"></i>
                    </div>
                </div>
            ` : '';

            document.getElementById('cart-root').innerHTML = `
                <div class="fixed inset-0 z-[100] transition-opacity duration-300 ${overlayClass}">
                    <div class="absolute inset-0 bg-[#3C2317]/40 backdrop-blur-sm" onclick="window.toggleCart(false)"></div>
                    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-[#FDFBF7] shadow-2xl transform transition-transform duration-500 ease-in-out flex flex-col rounded-l-[2rem] border-l-4 border-[#3C2317] ${panelClass}">
                        <div class="p-6 border-b-2 border-[#3C2317]/10 flex justify-between items-center bg-[#FFDC39] rounded-tl-[1.8rem]">
                            <h2 class="text-2xl font-black text-[#3C2317] uppercase tracking-tighter">${t('cartTitle')}</h2>
                            <button onclick="window.toggleCart(false)" class="bg-white rounded-full p-1 border-2 border-[#3C2317] text-[#3C2317] hover:scale-110 transition-transform">
                                <i class="ph ph-x text-lg"></i>
                            </button>
                        </div>
                        <div class="flex-grow overflow-y-auto p-6 space-y-4">
                            ${cartItemsHTML}
                        </div>
                        ${cartFooterHTML}
                    </div>
                </div>
            `;
        };

        // --- INICIALIZADOR ---
        const renderApp = () => {
            renderNavbar();
            if (state.currentView === 'home') renderHome();
            if (state.currentView === 'shop') renderShop();
            if (state.currentView === 'admin') renderAdmin();
            renderFooter();
            renderCart(); 
        };

        // Arrancar la app
        renderApp();
    </script>
</body>
</html>
