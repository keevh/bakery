services:
  postgres:
    image: postgres:17-alpine
    container_name: bakery-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bakery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bakery"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - bakery-postgres-data:/var/lib/postgresql/data

volumes:
  bakery-postgres-data:
